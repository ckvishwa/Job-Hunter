# Continuous integration for Job Hunter (SDLC-T01). CI only: nothing here deploys, releases, publishes
# artifacts or contacts an employer. All inputs are the repository's synthetic fixtures; the workflow has no
# access to candidate data, browser sessions, resumes, credentials or any repository secret.
#
# Design notes live in docs/sdlc/CI.md. Required check for branch protection (owner action): "CI gate".
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [careerops-integration, main]
  push:
    branches: [careerops-integration, main, 'recovery/**']
  workflow_dispatch:

# Least privilege: read-only token for every job. `pull_request` (never `pull_request_target`) is used, so a
# fork's code never runs with repository secrets or a write token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NO_COLOR: "1"

jobs:
  static:
    name: Static checks (typecheck, build, isolation)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (clean, no credentials persisted)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup Node.js (version pinned in .nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Confirm the checkout holds no private candidate data
        run: test ! -e private-runtime
      - name: Install dependencies (npm ci fails if package.json and the lockfile disagree)
        run: npm ci
      - name: Lockfile unchanged by install
        run: git diff --exit-code -- package-lock.json
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Tests do not read private candidate data (static)
        run: npm run ci:isolation -- static
      - name: Markdown links resolve and every doc is reachable from docs/INDEX.md
        run: node scripts/check-markdown-links.mjs
      - name: Locked PRD checksum and progress ledger in sync
        run: python3 scripts/sync_progress.py --check


  # Fast browser-free feedback for drafts and ready pull requests.
  test-fast:
    name: Fast tests (browser-free)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (clean, no credentials persisted)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup Node.js (version pinned in .nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Private-path guard (no candidate data, secrets, weights or file over 5 MB in the committed tree)
        run: npm run ci:private-tree
      - name: Check isolation before tests
        run: npm run ci:isolation -- before
      - name: Run deterministic tests without launching Chrome
        run: npm run test:fast
      - name: Check checkout remains clean
        run: npm run ci:isolation -- after

  test-linux:
    name: Full tests (Linux, PostgreSQL, headed Chrome under Xvfb)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # CI-only throwaway database credentials; the service container lives and dies with this job.
      JH_PG_USER: jobhunter
      JH_PG_DB: jobhunter
      JH_PG_PASSWORD: ci-${{ github.run_id }}-pg
      JH_PG_PORT: '5432'
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: jobhunter
          POSTGRES_DB: jobhunter
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-pg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobhunter -d jobhunter"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Checkout (clean, no credentials persisted)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup Node.js (version pinned in .nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install web (Astro) dependencies; tests/web and the UI e2e import web/ (Astro tsconfig)
        run: npm ci --prefix web
      - name: Database settings for the DB-backed suites (gitignored infra/.env, CI-only values)
        run: |
          printf 'JH_PG_USER=%s\nJH_PG_PASSWORD=%s\nJH_PG_DB=%s\nJH_PG_PORT=%s\nJH_API_ACCESS_TOKEN=%s\nJH_SESSION_SECRET=%s\nJH_AI_SERVICE_TOKEN=%s\n' "$JH_PG_USER" "$JH_PG_PASSWORD" "$JH_PG_DB" "$JH_PG_PORT" "$(openssl rand -hex 24)" "$(openssl rand -hex 24)" "$(openssl rand -hex 24)" > infra/.env
      - name: Isolated ML interpreter outside the checkout (pinned requirements)
        run: |
          python3 -m venv "$RUNNER_TEMP/ml-venv"
          "$RUNNER_TEMP/ml-venv/bin/python" -m pip install --disable-pip-version-check -q -r services/ml/requirements.lock
          echo "JH_ML_PYTHON=$RUNNER_TEMP/ml-venv/bin/python" >> "$GITHUB_ENV"
      - name: Apply database migrations to an empty database
        run: npm run db:migrate
      - name: Checkout holds no private data
        run: npm run ci:isolation -- before
      - name: Install browsers (Playwright-pinned Chromium and Google Chrome for the headed channel) and Xvfb
        run: |
          npx playwright install --with-deps chromium chrome
          sudo apt-get install -y --no-install-recommends xvfb
      - name: Full test suite (headed Chrome on a virtual display; loopback fixtures only)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npm test
      - name: Test run left the checkout clean and created no private data
        run: npm run ci:isolation -- after

  test-windows:
    name: Full tests (Windows, headed Chrome)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout (clean, no credentials persisted)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup Node.js (version pinned in .nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install web (Astro) dependencies; tests/web and the UI e2e import web/ (Astro tsconfig)
        run: npm ci --prefix web
      - name: Checkout holds no private data
        run: npm run ci:isolation -- before
      - name: Install browsers (Playwright-pinned Chromium and Google Chrome for the headed channel)
        run: npx playwright install chromium chrome
      - name: Full test suite (headed Chrome; loopback fixtures only)
        run: npm test
      - name: Test run left the checkout clean and created no private data
        run: npm run ci:isolation -- after

  secret-scan:
    name: Secret and private-data scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # Published sha256 of gitleaks_8.30.1_linux_x64.tar.gz (from the release's checksums file).
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout full history (no credentials persisted)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned version, checksum verified)
        run: |
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/gitleaks" && tar -xzf gitleaks.tgz -C "${RUNNER_TEMP}/gitleaks" gitleaks
          rm gitleaks.tgz
      - name: Scan Git history (values redacted in logs; fingerprints in .gitleaksignore are reviewed history)
        run: '"${RUNNER_TEMP}/gitleaks/gitleaks" detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1'
      - name: Scan the checked-out tree (catches content not visible in commit diffs)
        run: '"${RUNNER_TEMP}/gitleaks/gitleaks" detect --source . --no-git --config .gitleaks.toml --redact --no-banner --exit-code 1'

  dependency-audit:
    name: Dependency advisory triage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (clean, no credentials persisted)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup Node.js (version pinned in .nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies without running install scripts
        run: npm ci --ignore-scripts
      - name: Advisory gate (production advisories fail; dev critical or high need an unexpired reviewed entry)
        run: npm run ci:audit

  ci-gate:
    name: CI gate
    if: always()
    needs: [static, test-fast, test-linux, test-windows, secret-scan, dependency-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Enforce fast-only draft versus full ready-for-review gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          CORE_RESULTS: ${{ format('{0} {1} {2} {3}', needs.static.result, needs['test-fast'].result, needs['secret-scan'].result, needs['dependency-audit'].result) }}
          HEADED_RESULTS: ${{ format('{0} {1}', needs['test-linux'].result, needs['test-windows'].result) }}
        run: |
          # Fail closed: use the PR's CURRENT draft state, not the event payload. A re-run of an old draft-time run
          # after the PR became ready would otherwise keep a stale "draft" flag and pass without headed Chrome.
          DRAFT_PR=false
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            DRAFT_PR=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq .draft) || { echo "CI gate FAILED: cannot read current PR draft state"; exit 1; }
            case "${DRAFT_PR}" in true|false) ;; *) echo "CI gate FAILED: unexpected draft state '${DRAFT_PR}'"; exit 1;; esac
          fi
          echo "current PR draft state: ${DRAFT_PR}"
          echo "core checks: ${CORE_RESULTS}"
          echo "headed checks: ${HEADED_RESULTS}"
          for r in ${CORE_RESULTS}; do
            if [ "$r" != "success" ]; then echo "CI gate FAILED: required fast/security job was not successful"; exit 1; fi
          done
          if [ "${DRAFT_PR}" = "true" ]; then
            for r in ${HEADED_RESULTS}; do
              if [ "$r" != "skipped" ] && [ "$r" != "success" ]; then echo "CI gate FAILED: unexpected headed job state on draft"; exit 1; fi
            done
            echo "FAST-ONLY PASS (draft PR): headed Chrome was NOT run. This is NOT a full Gate A pass."
            echo "### Fast checks passed; headed E2E not run (draft PR)" >> "${GITHUB_STEP_SUMMARY}"
          else
            for r in ${HEADED_RESULTS}; do
              if [ "$r" != "success" ]; then echo "CI gate FAILED: required full headed test job did not succeed"; exit 1; fi
            done
            echo "FULL CI gate passed (both headed platforms + fast/security checks)"
            echo "### Full CI checks passed, including Linux and Windows headed Chrome" >> "${GITHUB_STEP_SUMMARY}"
          fi
